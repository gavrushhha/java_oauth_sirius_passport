spring.application.name=auth-demo
server.port=8080
spring.config.import=optional:file:.env[.properties]

# --- Sirius Passport (активно) ---
spring.security.oauth2.client.provider.sirius.authorization-uri=${SIRIUS_PASSPORT_AUTH_URI:https://keykloak.talantiuspeh.ru/realms/testlims/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.sirius.token-uri=${SIRIUS_PASSPORT_TOKEN_URI:https://keykloak.talantiuspeh.ru/realms/testlims/protocol/openid-connect/token}
spring.security.oauth2.client.provider.sirius.user-info-uri=${SIRIUS_PASSPORT_USERINFO_URI:https://keykloak.talantiuspeh.ru/realms/testlims/protocol/openid-connect/userinfo}
spring.security.oauth2.client.provider.sirius.jwk-set-uri=${SIRIUS_PASSPORT_JWKS_URI:https://keykloak.talantiuspeh.ru/realms/testlims/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.sirius.user-name-attribute=preferred_username

spring.security.oauth2.client.registration.sirius.provider=sirius
spring.security.oauth2.client.registration.sirius.client-name=Sirius Passport
spring.security.oauth2.client.registration.sirius.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sirius.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.sirius.scope=openid,phone
spring.security.oauth2.client.registration.sirius.client-id=${SIRIUS_PASSPORT_CLIENT_ID:replace-me}
spring.security.oauth2.client.registration.sirius.client-secret=${SIRIUS_PASSPORT_CLIENT_SECRET:replace-me}

